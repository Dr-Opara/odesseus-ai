name: Odesseus Live Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/odesseus-live-windows-v1
    paths:
      - "apps/odesseus-live-desktop/**"
      - ".github/workflows/live-desktop-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/odesseus-live-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        run: npm install --ignore-scripts

      - name: Rebuild Electron dependencies
        run: npm rebuild

      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OdesseusLiveSetup
          path: apps/odesseus-live-desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
