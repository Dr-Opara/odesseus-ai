name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Placeholder values only — no production credentials are required
      # for lint/typecheck/unit-test/build. Real provider credentials are
      # configured separately per environment (Vercel Preview/Production).
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      OPENAI_API_KEY: ci-placeholder-openai-key
      STRIPE_SECRET_KEY: ci-placeholder-stripe-key
      STRIPE_WEBHOOK_SECRET: ci-placeholder-webhook-secret
      CRON_SECRET: ci-placeholder-cron-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit + integration tests
        run: npm test

      - name: Build
        run: npm run build

  database:
    # The database suite is the strongest evidence in the repository: the RLS
    # audit, the cross-actor authorization audit, the wallet ledger, the seat
    # policy and the Live guest-access tests all run as real Postgres roles
    # against a real database, and none of them can be expressed as a unit test
    # with a mocked client.
    #
    # It was not wired into CI, which meant a change to a GRANT, a policy or a
    # SECURITY DEFINER function could merge having passed only the tests that
    # mock the database. Kept as its own job because it needs the Supabase CLI
    # and a container, not just Node.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # The version in package.json's devDependencies, not `latest`. The
          # local stack is a set of images, and the storage-api binary and the
          # Postgres image that seeds storage.objects must come from the same
          # CLI release -- a drift between them is invisible in the schema and
          # surfaces only as a runtime provider failure. See scripts/README.md.
          version: 2.119.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start the local database
        run: npm run db:start

      - name: Apply every migration from zero
        run: npm run db:reset

      # Lint before the suite: a policy or constraint Postgres will not accept
      # is a finding in its own right, and running it first means the suite only
      # ever reports behavioural failures.
      - name: Schema lint
        run: npm run db:lint

      - name: Database tests (pgTAP)
        run: npm run db:test
